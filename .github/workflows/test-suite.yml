name: Test suite

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-clone:
    name: Fresh-clone tests
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src:.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Build wheel
        run: |
          mkdir -p "${RUNNER_TEMP}/tokenlab-wheel"
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/tokenlab-wheel" .

      - name: Smoke-test installed commands
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "${smoke_dir}/venv"
          cd "${smoke_dir}"
          env -u PYTHONPATH "${smoke_dir}/venv/bin/python" -m pip install \
            --force-reinstall \
            "${RUNNER_TEMP}"/tokenlab-wheel/*.whl
          env -u PYTHONPATH "${smoke_dir}/venv/bin/python" -m pip check

          mkdir -p "${smoke_dir}/work/projects/smoke"
          printf '%s\n' \
            'import os' \
            'import sys' \
            'from pathlib import Path' \
            'import TokenLab' \
            'assert Path.cwd().name == "smoke"' \
            'assert os.environ["MPLBACKEND"] == "Agg"' \
            'assert Path(sys.prefix).resolve() in Path(TokenLab.__file__).resolve().parents' \
            'print("installed TokenLab smoke passed")' \
            > "${smoke_dir}/work/projects/smoke/smoke.py"

          cd "${smoke_dir}/work"
          env -u PYTHONPATH "${smoke_dir}/venv/bin/tokenlab" --help
          env -u PYTHONPATH "${smoke_dir}/venv/bin/tokenlab-verify" --help
          env -u PYTHONPATH "${smoke_dir}/venv/bin/tokenlab" --list
          env -u PYTHONPATH "${smoke_dir}/venv/bin/tokenlab" --project smoke
          env -u PYTHONPATH "${smoke_dir}/venv/bin/python" -c \
            'import sys; from pathlib import Path; import TokenLab; assert Path(sys.prefix).resolve() in Path(TokenLab.__file__).resolve().parents'

      - name: Run test suite
        run: python -m pytest -q
