m1_cdp_baseline:
  scenario_id: m1_cdp_baseline
  description: Main M1 baseline using 220M CDP Unified User IDs.
  initial_viewers: 220_000_000
  claim_rate: 0.50
  verification_pass_rate: 0.94
  verified_claimants: 103_400_000

  cohort_shares: profile_tier_mapping

  use_default_economics: true

