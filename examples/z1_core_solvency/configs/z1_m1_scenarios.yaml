stable_case_overrides:
  claim_rate: 0.50
  treasury:
    initial_balance: 150_000_000_000
    brand_inflow_per_epoch: 1_500_000_000

  vesting:
    vesting_lag_epochs: 26
    vesting_mode: staggered_cliff
    stagger_window_epochs: 26

  settlement:
    settlement_propensity_per_epoch:
      passive_viewers: 0.02
      active_viewers: 0.05
      power_users: 0.10
    settlement_cap_ratio_to_current_ar: 0.01

  utility_spend:
    spend_rate_per_epoch:
      passive_viewers: 0.010
      active_viewers: 0.040
      power_users: 0.080
    utility_fee_share: 0.20
    utility_burn_share: 0.05
    provider_share: 0.75

collapse_case_overrides:
  claim_rate: 0.80
  treasury:
    initial_balance: 50_000_000_000
    brand_inflow_per_epoch: 0

  vesting:
    vesting_lag_epochs: 26
    vesting_mode: single_cliff
    stagger_window_epochs: 0

  acr:
    weekly_acr_issue_rate_per_verified_user:
      passive_viewers: 30
      active_viewers: 75
      power_users: 150

  settlement:
    settlement_propensity_per_epoch:
      passive_viewers: 0.15
      active_viewers: 0.30
      power_users: 0.60
    settlement_cap_ratio_to_current_ar: 0.05

  utility_spend:
    spend_rate_per_epoch:
      passive_viewers: 0.002
      active_viewers: 0.006
      power_users: 0.010
    utility_fee_share: 0.20
    utility_burn_share: 0.02
    provider_share: 0.78
