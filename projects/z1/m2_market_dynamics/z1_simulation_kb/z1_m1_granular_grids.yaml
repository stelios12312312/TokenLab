  C4_onboarding_profiles:
  - parameter_name: onboarding_profiles
    tier: anchor
    values:
    - front_loaded
    - linear
    - back_loaded
    count: 3
    unit: categorical
    status: source_backed
    milestone: M1
    active_in_m1: true
    provenance: "Z1 Phase 3 Plan \u2014 exact source-backed values"
    rationale: Three canonical onboarding temporal profiles
    constraints:
    - Anchor values must always be included
  - parameter_name: onboarding_profiles
    tier: extended
    values:
    - front_loaded
    - linear
    - back_loaded
    - front_spike
    - front_sigmoid
    - early_plateau
    - convex_growth
    - concave_growth
    - late_sigmoid
    - late_spike
    - two_wave
    - three_wave
    - seasonal_pulse
    - step_change
    - tge_shock_then_decay
    - cliff_wave_synced
    - cliff_wave_staggered
    profile_definitions:
    - name: front_loaded
      curve: front_loaded
      params: {}
      pressure_effect: varies
      description: 'Source-backed anchor profile: front_loaded'
    - name: linear
      curve: linear
      params: {}
      pressure_effect: varies
      description: 'Source-backed anchor profile: linear'
    - name: back_loaded
      curve: back_loaded
      params: {}
      pressure_effect: varies
      description: 'Source-backed anchor profile: back_loaded'
    - name: front_spike
      curve: exponential_decay
      params:
        decay_rate: 0.15
      pressure_effect: concentrates
      description: Rapid early onboarding spike then sharp decline
    - name: front_sigmoid
      curve: sigmoid_early
      params:
        midpoint_epoch: 13
        steepness: 0.4
      pressure_effect: concentrates
      description: S-curve completing bulk onboarding in first quarter
    - name: early_plateau
      curve: ramp_then_flat
      params:
        ramp_epochs: 20
        plateau_ratio: 0.8
      pressure_effect: concentrates
      description: Quick ramp to plateau, sustained high onboarding
    - name: convex_growth
      curve: power_law
      params:
        exponent: 0.5
      pressure_effect: disperses
      description: Decelerating growth (square root shaped)
    - name: concave_growth
      curve: power_law
      params:
        exponent: 2.0
      pressure_effect: concentrates
      description: Accelerating growth (quadratic)
    - name: late_sigmoid
      curve: sigmoid_late
      params:
        midpoint_epoch: 78
        steepness: 0.4
      pressure_effect: disperses
      description: S-curve with bulk onboarding in last quarter
    - name: late_spike
      curve: exponential_growth
      params:
        growth_rate: 0.05
      pressure_effect: disperses
      description: Slow start with exponential ramp at end
    - name: two_wave
      curve: bimodal_gaussian
      params:
        peaks:
        - 26
        - 78
        widths:
        - 10
        - 10
      pressure_effect: disperses
      description: Two onboarding waves at epochs 26 and 78
    - name: three_wave
      curve: trimodal_gaussian
      params:
        peaks:
        - 17
        - 52
        - 87
        widths:
        - 8
        - 8
        - 8
      pressure_effect: disperses
      description: Three evenly spaced onboarding waves
    - name: seasonal_pulse
      curve: sinusoidal
      params:
        period_epochs: 26
        amplitude: 0.5
      pressure_effect: disperses
      description: Quarterly seasonal onboarding pulses
    - name: step_change
      curve: step_function
      params:
        steps:
        - 0.2
        - 0.5
        - 0.8
        - 1.0
        step_epochs:
        - 0
        - 26
        - 52
        - 78
      pressure_effect: disperses
      description: Discrete step increases in onboarding rate
    - name: tge_shock_then_decay
      curve: impulse_decay
      params:
        impulse_fraction: 0.3
        decay_rate: 0.05
      pressure_effect: concentrates
      description: Large TGE burst then exponential decay
    - name: cliff_wave_synced
      curve: cliff_synced_pulse
      params:
        cliff_epoch: 26
        wave_width: 5
      pressure_effect: concentrates
      description: Onboarding wave timed to coincide with cliff unlock
    - name: cliff_wave_staggered
      curve: cliff_staggered_pulse
      params:
        cliff_epoch: 26
        offset: 13
      pressure_effect: disperses
      description: Onboarding wave offset from cliff unlock by half period
    count: 17
    unit: categorical
    status: derived_grid
    milestone: M1
    active_in_m1: true
    provenance: Derived profiles expanding anchor set with diverse temporal patterns
    rationale: 14 additional profiles cover spike, sigmoid, wave, seasonal, and cliff-synced patterns
    constraints:
    - Must include all 3 anchor profiles
