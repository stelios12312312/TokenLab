# Canonical public vesting/unlock demo — concentrated unlocks (schema v2).
#
# Vesting/unlock archetype: a synthetic, exactly reconciling five-pool
# allocation (TGE float 150,000,000 VTLB via SupplyController_Constant plus
# Ecosystem Incentives 250,000,000 / Core Contributors 200,000,000 /
# Early Backers 150,000,000 / Community Reserve 150,000,000 /
# Liquidity Bootstrap 100,000,000 as SupplyController_CliffVesting pools,
# summing to the illustrative total supply of 1,000,000,000 with no
# residual) is released over 48 steps. Each cliff is a zero-release delay,
# NOT a lump-sum unlock; this concentrated variant compresses every pool's
# unlock into 1-3 periods after its cliff (cliffs staggered 6/12/18). The
# allocation is generated by TokenLab.agentic.data.synthetic_vesting from
# documented constants; it is synthetic, uncalibrated, and carries no client
# or market data lineage. The exogenous fiat volume series is the documented
# synthetic_vesting baseline (logistic rise + jitter + terminal dip, recorded
# seed 20260819, 48 periods, units "illustrative $ per step"). The four
# priors are illustrative, uncalibrated, explicitly independent, per-path
# parameter draws bracketing the library defaults and the declared cliff
# schedule. They are not fitted to data and are not a forecast. Modeled
# unlock pressure is supply expansion only — not sell-pressure or liquidity
# modeling.
schema_version: 2
scenario_id: public-vesting-concentrated-v2
economy:
  type: TokenEconomy_Basic
  parameters:
    initial_price: 0.01
    fiat: "$"
    token: VTLB
  holding_time:
    type: HoldingTime_Stochastic
    parameters:
      holding_time_params: {loc: 0, s: 1}
      minimum: 0.1
  supply:
    # TGE float: the constant controller emits 150,000,000 on the first step
    # and zero afterwards, so it acts as a one-time float; the CliffVesting
    # pools below add their per-step unlocks to circulating supply.
    type: SupplyController_Constant
    parameters:
      supply: 150000000
  price:
    type: PriceFunction_LinearRegression
    parameters:
      std_prior: 0.1
      anchoring: 0.3
  supply_pools:
    - type: SupplyController_CliffVesting
      parameters:
        token_amount: 250000000
        vesting_period: 3
        cliff: 6
        name: Ecosystem Incentives
    - type: SupplyController_CliffVesting
      parameters:
        token_amount: 200000000
        vesting_period: 2
        cliff: 12
        name: Core Contributors
    - type: SupplyController_CliffVesting
      parameters:
        token_amount: 150000000
        vesting_period: 1
        cliff: 12
        name: Early Backers
    - type: SupplyController_CliffVesting
      parameters:
        token_amount: 150000000
        vesting_period: 3
        cliff: 18
        name: Community Reserve
    - type: SupplyController_CliffVesting
      parameters:
        token_amount: 100000000
        vesting_period: 1
        cliff: 6
        name: Liquidity Bootstrap
  agent_pools:
    - id: vesting-demand
      type: AgentPool_Basic
      parameters:
        currency: "$"
        name: vesting-demand
      users:
        # Placeholder cohort: TransactionManagement_FromData replays the
        # exogenous volume series and ignores the user count; the constant
        # pool documents this rather than implying user-driven demand.
        type: UserGrowth_Constant
        parameters:
          constant: 1
      transactions:
        type: TransactionManagement_FromData
        parameters:
          # Inline copy of
          # synthetic_vesting.synthetic_vesting_demand_series() (logistic
          # rise + jitter + terminal dip, seed 20260819); the parity test
          # re-derives it from the documented formula.
          data: [4550, 7340, 13805, 23110, 38645, 64628, 105603, 180664, 273985, 395039, 518922, 700132, 782534, 920384, 971086, 1024816, 1073429, 1152140, 1077582, 1101035, 1025376, 1085493, 1101397, 1103724, 1116482, 1098708, 1118373, 1060616, 1095488, 1097066, 1107805, 1116728, 1108772, 1125166, 1164293, 1077498, 1041768, 1211180, 1039557, 1066747, 1126293, 1141823, 1120273, 1092402, 1105591, 1107670, 1154534, 658436]
monte_carlo:
  simulator: TokenMetaSimulator
  # 48 steps cover the maximum cliff + vesting_period across the declared
  # prior support (max cliff 24 + max vesting 24).
  iterations: 48
  repetitions: 1
  seed: 20260819
artifacts:
  format: csv
uncertainty:
  parameters:
    - id: price_std_prior
      path: economy.price.parameters.std_prior
      value_type: number
      unit: price-noise scale as a fraction of the previous price
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 0.05
        mode: 0.1
        maximum: 0.2
      bounds: {minimum: 0.05, maximum: 0.2}
      provenance: "Library default bracket for PriceFunction_LinearRegression, uncalibrated; sanitized illustrative demo assumption."
      rationale: "Brackets the price-noise scale around the library default 0.1, from half to double the default."
      calibration: illustrative
      approval: approved
      dependence: independent
    - id: price_anchoring
      path: economy.price.parameters.anchoring
      value_type: number
      unit: fraction of the previous price retained per step
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 0.1
        mode: 0.3
        maximum: 0.5
      bounds: {minimum: 0.1, maximum: 0.5}
      provenance: "Library default bracket for PriceFunction_LinearRegression, uncalibrated; sanitized illustrative demo assumption."
      rationale: "Brackets the price-anchoring weight around the library default 0.3 within the documented [0.1, 0.5] bracket."
      calibration: illustrative
      approval: approved
      dependence: independent
    - id: holding_time_dispersion
      path: economy.holding_time.parameters.holding_time_params.s
      value_type: number
      unit: lognorm shape parameter
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 0.5
        mode: 1.0
        maximum: 1.5
      bounds: {minimum: 0.5, maximum: 1.5}
      provenance: "Library default bracket for HoldingTime_Stochastic (lognorm), uncalibrated; sanitized illustrative demo assumption."
      rationale: "Brackets the holding-time lognorm shape around the library default 1.0, from half to 1.5x the default."
      calibration: illustrative
      approval: approved
      dependence: independent
    - id: early_backers_cliff
      path: economy.supply_pools[2].parameters.cliff
      value_type: integer
      unit: months
      rounding: nearest_integer
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 6
        mode: 12
        maximum: 24
      bounds: {minimum: 6, maximum: 24}
      provenance: "Illustrative bracket around the declared synthetic Early Backers cliff, uncalibrated; sanitized illustrative demo assumption."
      rationale: "Varies the Early Backers zero-release cliff across the documented staggered set and beyond (6 to 24 months, centered on the declared 12), keeping total allocation and post-vesting supply unchanged."
      calibration: illustrative
      approval: approved
      dependence: independent
  dependence_groups: []
