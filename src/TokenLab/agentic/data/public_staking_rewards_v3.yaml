# Canonical public staking/rewards demo (schema v3).
#
# Staking/rewards archetype: a single illustrative STLB economy whose core
# supply is an exogenous synthetic release series (linear ramp 2,000,000 ->
# 6,000,000 STLB per step, jittered, recorded seed 20260821) and whose
# staking cohort is an AgentPool_Staking pool spawning SupplyStakerLockup
# stakers from a synthetic token-denominated demand series (floored
# logistic ramp, recorded seed 20260823). Stakers lock a fixed illustrative
# amount and receive a fixed illustrative token reward at unlock:
# reward_as_perc is pinned explicitly to false (the library default is
# multiplicative and must never be inherited silently). No treasury is
# declared, so rewards are honestly modeled as minted dilution of the
# circulating supply — the profile's tokenomics ledger states this
# distinction. Both series are generated by
# TokenLab.agentic.data.synthetic_staking from documented constants; they
# are synthetic, uncalibrated, and carry no client or market data lineage.
# The three priors are illustrative, uncalibrated, explicitly independent,
# per-path parameter draws bracketing the declared configuration. They are
# not fitted to data and are not a forecast; the reward amount is a fixed
# token quantity per staker, never a rate and never APY.
schema_version: 3
scenario_id: public-staking-rewards-v3
economy:
  type: TokenEconomy_Basic
  parameters:
    initial_price: 0.05
    fiat: "$"
    token: STLB
  holding_time:
    type: HoldingTime_Constant
    parameters:
      holding_time: 6.0
  supply:
    # Exogenous release schedule: SupplyController_FromData emits each
    # step's addition and supply_is_added accumulates it; the series is the
    # documented synthetic_staking linear ramp (seed 20260821). The parity
    # test re-derives it from the documented formula.
    type: SupplyController_FromData
    parameters:
      values: [2103343, 2089347, 2330034, 2335061, 2497140, 2489182, 2575887, 2798936, 2991846, 3098928, 3245311, 3178317, 3332707, 3444824, 3597637, 3816786, 3805374, 4013117, 4104438, 4076318, 4383481, 4444060, 4473345, 4539965, 4654297, 4746698, 5021385, 4877029, 5102675, 5318124, 5516273, 5473053, 5656672, 5818645, 5688191, 6147166]
  price:
    type: PriceFunction_EOE
    parameters: {}
  supply_pools: []
  agent_pools:
    - id: staking-demand
      type: AgentPool_Staking
      parameters:
        currency: STLB
        name: staking-demand
      staking:
        # Lockup stakers: fixed stake, fixed token reward at unlock, 9-step
        # lockup. reward_as_perc pinned false (fixed amount, NOT the
        # multiplicative library default). No treasury is declared, so
        # rewards mint into circulating supply (modeled dilution).
        type: SupplyStakerLockup
        parameters:
          staking_amount: 40000
          rewards: 1600
          lockup_duration: 9
          reward_as_perc: false
      users:
        # Placeholder cohort: the FromData transactions controller replays
        # the exogenous staking-demand series; the constant pool documents
        # this rather than implying user-driven demand.
        type: UserGrowth_Constant
        parameters:
          constant: 240
      transactions:
        type: TransactionManagement_FromData
        parameters:
          # Inline copy of
          # synthetic_staking.synthetic_staking_demand_series() (floored
          # logistic ramp + jitter + terminal dip, seed 20260823); the
          # parity test re-derives it from the documented formula.
          data: [122520, 128211, 132430, 128649, 132257, 148743, 158744, 175335, 183086, 212716, 240657, 270787, 326288, 388305, 441698, 499555, 556747, 615776, 610075, 678085, 683691, 721955, 710184, 728535, 742072, 726185, 726153, 764144, 744059, 741598, 738299, 745473, 746635, 732305, 776677, 531874]
monte_carlo:
  simulator: TokenMetaSimulator
  # 36 steps comfortably cover the maximum lockup duration across the
  # declared prior support (12 months) plus a post-unlock tail.
  iterations: 36
  repetitions: 1
  seed: 20260821
artifacts:
  format: csv
uncertainty:
  parameters:
    - id: staking_amount
      path: economy.agent_pools[0].staking.parameters.staking_amount
      value_type: integer
      unit: STLB locked per staker
      rounding: nearest_integer
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 20000
        mode: 40000
        maximum: 80000
      bounds: {minimum: 20000, maximum: 80000}
      provenance: "Illustrative bracket around the declared synthetic staking amount, uncalibrated; sanitized illustrative demo assumption."
      rationale: "Varies the fixed per-staker lockup from half to double the declared 40,000 STLB, keeping the staking mechanics and reward mode unchanged."
      calibration: illustrative
      approval: approved
      dependence: independent
    - id: staking_reward_amount
      path: economy.agent_pools[0].staking.parameters.rewards
      value_type: integer
      unit: STLB minted per staker at unlock
      rounding: nearest_integer
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 800
        mode: 1600
        maximum: 3200
      bounds: {minimum: 800, maximum: 3200}
      provenance: "Illustrative bracket around the declared synthetic fixed reward amount, uncalibrated; sanitized illustrative demo assumption."
      rationale: "Varies the fixed token reward paid at unlock from half to double the declared 1,600 STLB; it is a fixed token quantity, never a rate and never APY."
      calibration: illustrative
      approval: approved
      dependence: independent
    - id: lockup_duration
      path: economy.agent_pools[0].staking.parameters.lockup_duration
      value_type: integer
      unit: months
      rounding: nearest_integer
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 6
        mode: 9
        maximum: 12
      bounds: {minimum: 6, maximum: 12}
      provenance: "Illustrative bracket around the declared synthetic lockup duration, uncalibrated; sanitized illustrative demo assumption."
      rationale: "Varies the zero-yield lockup window across 6 to 12 months, centered on the declared 9, so the 36-step horizon always covers the full lockup plus a post-unlock tail."
      calibration: illustrative
      approval: approved
      dependence: independent
  dependence_groups: []
