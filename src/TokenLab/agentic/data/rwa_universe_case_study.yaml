    name: 4. Concentrated institutional run
    short_label: 30% institutional run
    description: 30% of the institutional cohort (about 15% of AUM) tenders in Month 12, followed by 15% of family offices and funds and 8% of smaller holders in Month 13.
    overrides:
      participation_multiplier: 0.8
      redemption_multiplier: 1.0
      cohort_withdrawal_shocks:
        12:
          institutional: 0.3
        13:
          hnw: 0.15
          retail: 0.08
      facility_capacity_multiplier: 1.0
      design_overrides: {}
