title: 'Tokenised RWA Universe: 17 Funds Listed on Solana Lending Venues plus Benchmarks'
subtitle: Investor returns, exit liquidity, looping and sponsor economics of 17 tokenised real-world-asset funds, public terms as of 28 October 2026, normalised to $25M over 36 months.
calibration_date: '2026-10-28'
per_product_portfolio: true
evidence_status:
  classification: public_terms_with_flagged_assumptions_and_synthetic_stress
  statement: Fund terms follow dated public sources recorded per parameter, as of 28 October 2026; the fund list and looped shares come from Kamino and Loopscale on-chain data read from a public Solana
    RPC. Parameters without a public source are flagged as assumptions and swept. All funds are simulated at a normalised $25M starting AUM over 36 months under nine synthetic scenarios; investor behaviour,
    stress shocks, credit-loss sensitivities and scenario probabilities are synthetic. Results describe these modelled structures, not the future performance of the named funds, and are not credit ratings
    or investment advice.
