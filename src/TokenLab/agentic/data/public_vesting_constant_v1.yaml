# No-unlock companion control for the public vesting demos.
#
# Deterministic negative control: same illustrative token skeleton as the
# vesting scenarios (VTLB, $ fiat, 48 steps, TGE float 150,000,000) but with
# NO supply pools at all — circulating supply stays at the TGE float for
# every step. Every controller is deterministic: constant holding time,
# equation-of-exchange price, and a constant fiat transaction volume instead
# of the replayed synthetic series. All values are illustrative and
# uncalibrated. Repeated paths are identical by construction: zero
# dispersion is a property of the deterministic controllers, not statistical
# evidence. This scenario is NOT Monte Carlo.
schema_version: 1
scenario_id: public-vesting-constant-v1
economy:
  type: TokenEconomy_Basic
  parameters:
    initial_price: 0.01
    fiat: "$"
    token: VTLB
  holding_time:
    type: HoldingTime_Constant
    parameters:
      holding_time: 1.0
  supply:
    # TGE float only: the constant controller emits 150,000,000 on the first
    # step and zero afterwards; with no supply pools there are no unlocks.
    type: SupplyController_Constant
    parameters:
      supply: 150000000
  price:
    type: PriceFunction_EOE
    parameters: {}
  supply_pools: []
  agent_pools:
    - id: vesting-constant
      type: AgentPool_Basic
      parameters:
        currency: "$"
        name: vesting-constant
      users:
        type: UserGrowth_Constant
        parameters:
          constant: 1
      transactions:
        type: TransactionManagement_Constant
        parameters:
          average_transaction_value: 900000
monte_carlo:
  simulator: TokenMetaSimulator
  iterations: 48
  repetitions: 4
  seed: 20260819
artifacts:
  format: csv
