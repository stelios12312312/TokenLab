      gate_max_pct_nav_per_period: {source: "Ondo: daily redemptions (USD 250k minimum), no gate", url: "https://ondo.finance/blog/building-on-buidl-how-ondo-leverages-blackrocks-tokenized-treasuries", as_of: "2024-08-28", confidence: "high"}
      queue_pricing: {source: "Redemptions at the $1.00 NAV on the redemption date", url: "https://ondo.finance/blog/building-on-buidl-how-ondo-leverages-blackrocks-tokenized-treasuries", as_of: "2024-08-28", confidence: "medium"}
      facility_max_capacity: {source: "Circle's USDC facility buys BUIDL from holders (typically up to 20M USDC, about 1% of AUM); it is not fund borrowing, so no fund-level facility is modelled", url: "https://ondo.finance/blog/the-liquidity-advantage-how-ousg-provides-robust-multi-venue-instant-liquidity", as_of: "2025-04-14", confidence: "verified"}
      facility_interest_rate_annual: {applicable: false, note: "no fund-level facility"}
      facility_commitment_fee_annual: {applicable: false, note: "no fund-level facility"}
      secondary_required_return_annual: {assumption: true, note: "matters only if a redemption queue forms", sweep: [0.06, 0.10, 0.15]}
      secondary_illiquidity_premium: {assumption: true, note: "Circle's off-ramp and T+0 redemptions keep any discount near zero", sweep: [0.0, 0.0025, 0.01]}

