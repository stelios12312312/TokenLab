scenarios:
  baseline:
    scenario_id: "baseline"
    name: "1. Baseline (Documented Term-Sheet Yields & Normal Turnover)"
    description: "Each product earns its documented asset-class yield (BUIDL 4.85%, SyrupUSDC 9.60%, SCOPE 10.40%) with normal subscription inflows (1.0x), normal redemption turnover (1.0x), and authentic underlying settlement lags (T+0, T+1, T+2)."
    overrides:
      participation_multiplier: 1.0
      redemption_multiplier: 1.0
      yield_delta_annual: 0.0
      capital_return_delta_annual: 0.0
      facility_capacity_multiplier: 1.0

  low_participation:
    scenario_id: "low_participation"
    name: "2. Lower On-Chain Inflows / Stagnant AUM Scale"
    description: "Subscription inflows fall by 75% (0.25x multiplier) and routine redemptions increase by 35% (1.35x), testing whether each issuer's fee margin covers fixed operating costs at ~$25M AUM."
    overrides:
      participation_multiplier: 0.25
      redemption_multiplier: 1.35
      yield_delta_annual: 0.0
      capital_return_delta_annual: 0.0
      facility_capacity_multiplier: 1.0

  adverse_asset_return:
    scenario_id: "adverse_asset_return"
    name: "3. Rate Cut & Credit Default Write-Down Shock"
    description: "Fed rate cuts compress yields by 150–220 bps while private-credit funds suffer discrete borrower default write-downs in Months 12 and 18 (SyrupUSDC -3.5% twice; SCOPE -2.0% twice; BUIDL US Treasuries 0% credit loss)."
    overrides:
      participation_multiplier: 0.70
      redemption_multiplier: 1.15
      yield_delta_annual: -0.020
      capital_return_delta_annual: 0.0
      capital_shock_schedule:
        12: -0.025
        18: -0.025
      facility_capacity_multiplier: 1.0
      design_overrides:
        buidl_treasury:
          yield_delta_annual: -0.015
          capital_shock_schedule: {}
        maple_syrup_usdc:
          yield_delta_annual: -0.022
          capital_shock_schedule:
            12: -0.035
            18: -0.035
        hamilton_lane_scope:
          yield_delta_annual: -0.018
          capital_shock_schedule:
            12: -0.020
            18: -0.020

  concentrated_withdrawals:
    scenario_id: "concentrated_withdrawals"
    name: "4. Concentrated Institutional DeFi / Treasury Run"
    description: "Two large institutional allocators tender 30% of the institutional cohort in Month 12, followed by a 15% HNW/hedge-fund withdrawal wave in Month 13."
    overrides:
      participation_multiplier: 0.80
      redemption_multiplier: 1.0
      cohort_withdrawal_shocks:
        12:
          institutional: 0.30
        13:
          hnw: 0.15
          retail: 0.08
      facility_capacity_multiplier: 1.0

  delayed_settlement:
    scenario_id: "delayed_settlement"
    name: "5. Underlying Loan Rollover Freeze & Extended Settlement Lag"
    description: "Private-credit loan repayments and secondary sales slow down during a Month-12 withdrawal wave (SyrupUSDC lag extends to 3 months / 95 bps haircut; SCOPE lag extends to 4 months / 140 bps haircut; BUIDL T-bills remain T+0 / 8 bps)."
    overrides:
      participation_multiplier: 0.85
      redemption_multiplier: 1.15
      settlement_lag_override: 3
      liquidation_haircut_bps_override: 95.0
      cohort_withdrawal_shocks:
        12:
          institutional: 0.18
          hnw: 0.10
      facility_capacity_multiplier: 1.0
      design_overrides:
        buidl_treasury:
          settlement_lag_override: 0
          liquidation_haircut_bps_override: 8.0
        maple_syrup_usdc:
          settlement_lag_override: 3
          liquidation_haircut_bps_override: 95.0
        hamilton_lane_scope:
          settlement_lag_override: 4
          liquidation_haircut_bps_override: 140.0

  reduced_external_liquidity:
    scenario_id: "reduced_external_liquidity"
    name: "6. Liquidity Facility Contraction (75% Cut to Instant Buffer / Credit Line)"
    description: "External liquidity buffers (Circle USDC buffer in BUIDL, protocol reserve in SyrupUSDC, NAV credit line in SCOPE) are cut by 75% during a 22% institutional + 12% HNW redemption wave."
    overrides:
      participation_multiplier: 0.80
      redemption_multiplier: 1.10
      facility_capacity_multiplier: 0.25
      cohort_withdrawal_shocks:
        12:
          institutional: 0.22
        13:
          hnw: 0.12

  combined_adverse:
    scenario_id: "combined_adverse"
    name: "7. Combined Macro & Credit Crisis (Yield Drop + Defaults + Run + Settlement Freeze)"
    description: "Simultaneous yield compression, Month-12 credit write-downs on loan books, 25% institutional + 15% HNW redemption run, extended loan liquidation lags, elevated forced-sale haircuts, and 50% facility reduction."
    overrides:
      participation_multiplier: 0.35
      redemption_multiplier: 1.25
      yield_delta_annual: -0.020
      capital_shock_schedule:
        12: -0.030
      settlement_lag_override: 3
      liquidation_haircut_bps_override: 110.0
      facility_capacity_multiplier: 0.50
      cohort_withdrawal_shocks:
        12:
          institutional: 0.25
          hnw: 0.10
        13:
          institutional: 0.10
          hnw: 0.15
          retail: 0.10
      design_overrides:
        buidl_treasury:
          yield_delta_annual: -0.015
          capital_shock_schedule: {}
          settlement_lag_override: 1
          liquidation_haircut_bps_override: 10.0
        maple_syrup_usdc:
          yield_delta_annual: -0.022
          capital_shock_schedule:
            12: -0.040
          settlement_lag_override: 3
          liquidation_haircut_bps_override: 110.0
        hamilton_lane_scope:
          yield_delta_annual: -0.018
          capital_shock_schedule:
            12: -0.025
          settlement_lag_override: 4
          liquidation_haircut_bps_override: 150.0

  reverse_stress_test:
    scenario_id: "reverse_stress_test"
    name: "8. Reverse Stress Test (Objective Breaking-Point Search)"
    description: "Systematic search identifying the minimum withdrawal shock or minimum AUM scale at which (a) the 3-month Payment Deadline SLA fails, (b) the 3% Liquidity Buffer floor fails, and (c) Issuer Operating Cost Coverage fails."
    overrides:
      participation_multiplier: 0.60
      redemption_multiplier: 1.15
      settlement_lag_override: 2
      liquidation_haircut_bps_override: 60.0
      cohort_withdrawal_shocks:
        12:
          institutional: 0.35
          hnw: 0.20
      design_overrides:
        buidl_treasury:
          settlement_lag_override: 0
          liquidation_haircut_bps_override: 5.0
        maple_syrup_usdc:
          settlement_lag_override: 2
          liquidation_haircut_bps_override: 65.0
        hamilton_lane_scope:
          settlement_lag_override: 3
          liquidation_haircut_bps_override: 110.0

monte_carlo:
  default_repetitions: 60
  random_seed: 20261026
  stochastic_yield_volatility_annual: 0.010
  stochastic_capital_volatility_annual: 0.015
  stochastic_redemption_noise_std: 0.012
