schema_version: "product_study.v2"
case_study_id: "real-rwa-funds-v1"
title: "Tokenised RWA Fund Structures: BUIDL vs. syrupUSDC vs. HLSCOPE"
subtitle: "Investor returns, exit liquidity and sponsor economics of three tokenised fund structures, using public terms as of 27 October 2026, normalised to $25M over 36 months."
calibration_date: "2026-10-27"
per_product_portfolio: true
evidence_status:
  classification: "public_terms_with_flagged_assumptions_and_synthetic_stress"
  statement: >
    Fund terms (fees, payout form, redemption mechanics and yields) follow the dated public
    sources recorded per parameter below, as of 27 October 2026. Parameters without a public
    source are flagged as assumptions and swept in the sensitivity analysis. All three
    structures are simulated at a normalised $25M starting AUM over 36 months under eight
    synthetic scenarios; investor behaviour, stress shocks and scenario probabilities are
    synthetic. Results describe these modelled structures, not the future performance of the
    named funds, and are not credit ratings or investment advice.

benchmarks:
  # Risk-free benchmark for excess return: 3-month T-bill proxy = BUIDL 30-day distribution
  # yield (3.70%, rwa.xyz, 2026-10-27) plus its blended management fee (0.26%).
  risk_free_rate_annual: 0.0396
  source: "https://app.rwa.xyz/assets/BUIDL"
  as_of: "2026-10-27"

real_world_provenance:
  - design_id: "buidl_treasury"
    product_name: "BlackRock USD Institutional Digital Liquidity Fund (BUIDL)"
    ticker: "BUIDL"
    issuer: "BlackRock"
    network_rail: "Securitize (transfer agent) on Solana, Avalanche, Ethereum, BNB Chain, Aptos and others"
    issuer_and_infra: "BlackRock • Securitize (transfer agent) • BNY (custodian) • Circle USDC off-ramp (holder-level)"
    asset_class: "Cash, US Treasury bills and repurchase agreements; stable $1.00 NAV"
  - design_id: "maple_syrup_usdc"
    product_name: "Maple syrupUSDC"
    ticker: "syrupUSDC"
    issuer: "Maple Finance"
    network_rail: "ERC-4626 vault (Ethereum and other chains)"
    issuer_and_infra: "Maple Finance • on-chain FIFO withdrawal queue"
    asset_class: "Fixed-rate, open-term, overcollateralised loans to crypto-native institutions (collateral mostly BTC)"
  - design_id: "hamilton_lane_scope"
    product_name: "Hamilton Lane Senior Credit Opportunities Fund (tokenised feeder HLSCOPE)"
    ticker: "HLSCOPE"
    issuer: "Hamilton Lane"
    network_rail: "Securitize feeder on Polygon, Ethereum, Optimism and others"
    issuer_and_infra: "Hamilton Lane • Securitize feeder (Reg D)"
    asset_class: "Senior secured, floating-rate private loans (multi-manager), with fund-level leverage"

time_convention:
  unit: "month"
  periods_per_year: 12
  horizon_periods: 36
  annualisation_convention: "compound_geometric_for_returns_linear_for_fee_rates"

objectives_tested:
  payment_sla_max_months: 3.0
  min_liquidity_buffer_pct_nav: 0.03
  issuer_operating_profit_floor_fiat: 0.0

underlying_portfolio:
  name: "Normalised $25M benchmark portfolio (per-fund asset calibration below)"
  initial_aum: 25000000.0
  initial_nav_per_token: 1.0
  gross_yield_annual: 0.05
  capital_appreciation_annual: 0.000
  portfolio_expense_annual: 0.0
  settlement_lag_periods: 1
  liquidation_haircut_bps: 35.0
  valuation_method: "stated_asset_valuation"

# Investor behaviour is synthetic and shared by all three funds (assumption); each fund
# overrides only holder counts. Target yields are re-centred on each fund's own net yield.
investor_cohorts:
  - cohort_id: "institutional"
    name: "Institutional Treasury & Credit Allocators"
    initial_capital_share: 0.50
    num_holders: 4
    base_subscription_rate_period: 0.012
    distribution_reinvestment_rate: 0.30
    base_redemption_rate_period: 0.008
    target_net_yield_annual: 0.064
    return_shortfall_sensitivity: 1.10
    nav_drawdown_sensitivity: 2.00
    queue_delay_sensitivity: 0.45
  - cohort_id: "hnw"
    name: "Family Offices & Funds"
    initial_capital_share: 0.30
    num_holders: 20
    base_subscription_rate_period: 0.015
    distribution_reinvestment_rate: 0.25
    base_redemption_rate_period: 0.010
    target_net_yield_annual: 0.064
    return_shortfall_sensitivity: 0.85
    nav_drawdown_sensitivity: 1.50
    queue_delay_sensitivity: 0.35
  - cohort_id: "retail"
    name: "Smaller Holders, DAO Treasuries & Protocols"
    initial_capital_share: 0.20
    num_holders: 200
    base_subscription_rate_period: 0.018
    distribution_reinvestment_rate: 0.15
    base_redemption_rate_period: 0.015
    target_net_yield_annual: 0.060
    return_shortfall_sensitivity: 0.60
    nav_drawdown_sensitivity: 1.15
    queue_delay_sensitivity: 0.25

# Scenario probabilities for the across-scenario investor score (assumption; also perturbed
# in the rank-probability analysis).
scenario_weights:
  baseline: 0.40
  low_participation: 0.15
  adverse_asset_return: 0.10
  concentrated_withdrawals: 0.10
  delayed_settlement: 0.075
  reduced_external_liquidity: 0.075
  combined_adverse: 0.05
  reverse_stress_test: 0.05

product_designs:
  buidl_treasury:
    design_id: "buidl_treasury"
    name: "BUIDL structure (tokenised T-bill fund, terms as of Oct 2026)"
    short_label: "BUIDL (T-bills)"
    positioning: "Tokenised US Treasury money-market fund: cash, T-bills and repo; stable $1.00 NAV; daily redemptions; income paid out; about 0.26% blended management fee."
    target_cash_buffer_pct: 0.0
    distribution_policy: "full_net_income"
    distribution_reinvestment_rate: 1.0
    expected_annual_redemption_turnover: 0.12
    real_world: {aum_fiat: 2160000000.0, holders: 101, as_of: "2026-10-27", source: "https://app.rwa.xyz/assets/BUIDL"}
    cohort_overrides:
      institutional: {num_holders: 20}
      hnw: {num_holders: 60}
      retail: {num_holders: 21}
    portfolio:
      name: "Cash, US Treasury bills and repo"
      gross_yield_annual: 0.0396
      capital_appreciation_annual: 0.000
      portfolio_expense_annual: 0.0
      settlement_lag_periods: 0
      liquidation_haircut_bps: 3.0
