      hurdle_rate_annual: {applicable: false, note: "no incentive fee documented; 6% is used only in the incentive-fee what-if"}
      redemption_fee_rate: {source: "rwa.xyz HLSCOPE: 0% redemption fee", url: "https://app.rwa.xyz/assets/HLSCOPE", as_of: "2026-10-27", confidence: "medium", note: "what-if: anti-dilution levy retained by the fund", sweep: [0.0, 0.005, 0.01]}
      redemption_fee_to_issuer_pct: {applicable: false, note: "no redemption fee"}
      platform_admin_fee_annual: {assumption: true, note: "Securitize: no transaction fees, but 'other fees do apply' (undisclosed)", sweep: [0.0, 0.001]}
      fixed_operating_cost_annual: {assumption: true, note: "illustrative standalone cost base; the feeder shares Hamilton Lane's and Securitize's infrastructure", sweep: [100000.0, 210000.0, 500000.0]}
      variable_operating_cost_bps: {assumption: true, sweep: [5.0, 12.0, 25.0]}
      gate_max_pct_nav_per_period: {assumption: true, note: "Hamilton Lane: 'option for monthly liquidity'; any gate, notice period or levy is set in the private offering documents, not in any public filing", sweep: [0.0167, 0.025, 0.05, 0.10]}
      queue_pricing: {assumption: true, note: "2023 terms redeemed at the previous quarter's NAV; stale-NAV pricing is not modelled", sweep: ["payment_date_nav", "request_date_nav"]}
      facility_max_capacity: {assumption: true, note: "no fund-level liquidity facility documented; the fund uses longer-term leverage for yield", sweep: [0.0, 1500000.0, 3000000.0]}
      facility_interest_rate_annual: {applicable: false, note: "used only in the facility what-if"}
      facility_commitment_fee_annual: {applicable: false, note: "used only in the facility what-if"}
      secondary_required_return_annual: {assumption: true, sweep: [0.08, 0.12, 0.20]}
      secondary_illiquidity_premium: {assumption: true, note: "allowance for uncertainty in private-credit marks", sweep: [0.0, 0.01, 0.03]}

scenarios:
  baseline:
    scenario_id: "baseline"
    name: "1. Baseline (current terms, normal turnover)"
    short_label: "Calm baseline"
    description: "Each fund earns its current yield (BUIDL 3.96%, syrupUSDC 6.07%, HLSCOPE 6.58% gross) with normal subscriptions (1.0x), normal redemption turnover (1.0x) and its own settlement lag (same-period, 1 month, 2 months)."
    overrides:
      participation_multiplier: 1.0
      redemption_multiplier: 1.0
      yield_delta_annual: 0.0
      capital_return_delta_annual: 0.0
      facility_capacity_multiplier: 1.0

  low_participation:
    scenario_id: "low_participation"
    name: "2. Low inflows / stagnant AUM"
    short_label: "Low inflows"
    description: "Subscriptions fall 75% (0.25x) and routine redemptions rise 35% (1.35x)."
    overrides:
      participation_multiplier: 0.25
      redemption_multiplier: 1.35
      yield_delta_annual: 0.0
      capital_return_delta_annual: 0.0
      facility_capacity_multiplier: 1.0

  adverse_asset_return:
    scenario_id: "adverse_asset_return"
    name: "3. Rate cut and credit write-downs"
    short_label: "Rate cut + defaults"
    description: "A 150 bp rate cut lowers every fund's yield and the risk-free rate; the lending funds take write-downs in Months 12 and 18 (syrupUSDC -3.5% twice, HLSCOPE -2.0% twice; none for T-bills)."
    overrides:
      participation_multiplier: 0.70
      redemption_multiplier: 1.15
      yield_delta_annual: -0.015
      risk_free_delta_annual: -0.015
      capital_return_delta_annual: 0.0
      capital_shock_schedule:
        12: -0.025
        18: -0.025
      facility_capacity_multiplier: 1.0
      design_overrides:
        buidl_treasury:
          capital_shock_schedule: {}
        maple_syrup_usdc:
          capital_shock_schedule:
            12: -0.035
            18: -0.035
        hamilton_lane_scope:
          capital_shock_schedule:
            12: -0.020
            18: -0.020

  concentrated_withdrawals:
    scenario_id: "concentrated_withdrawals"
    name: "4. Concentrated institutional run"
    short_label: "30% institutional run"
    description: "30% of the institutional cohort (about 15% of AUM) tenders in Month 12, followed by 15% of family offices and funds and 8% of smaller holders in Month 13."
    overrides:
      participation_multiplier: 0.80
      redemption_multiplier: 1.0
      cohort_withdrawal_shocks:
        12:
          institutional: 0.30
        13:
          hnw: 0.15
          retail: 0.08
      facility_capacity_multiplier: 1.0

  delayed_settlement:
    scenario_id: "delayed_settlement"
    name: "5. Loan rollover freeze and longer settlement"
    short_label: "Settlement freeze"
    description: "A Month-12 withdrawal wave meets slower asset sales: syrupUSDC lag 3 months and 95 bp haircut; HLSCOPE lag 4 months and 140 bp haircut; T-bills settle same-period at 8 bp."
    overrides:
      participation_multiplier: 0.85
      redemption_multiplier: 1.15
      settlement_lag_override: 3
      liquidation_haircut_bps_override: 95.0
      cohort_withdrawal_shocks:
        12:
          institutional: 0.18
          hnw: 0.10
      facility_capacity_multiplier: 1.0
      design_overrides:
        buidl_treasury:
          settlement_lag_override: 0
          liquidation_haircut_bps_override: 8.0
        maple_syrup_usdc:
          settlement_lag_override: 3
          liquidation_haircut_bps_override: 95.0
        hamilton_lane_scope:
          settlement_lag_override: 4
          liquidation_haircut_bps_override: 140.0

  reduced_external_liquidity:
    scenario_id: "reduced_external_liquidity"
    name: "6. Liquidity-provider pullback (75% facility cut) and redemption wave"
    short_label: "Facility cut + wave"
    description: "Any fund-level facility is cut by 75% (none of the three documents one, so only the wave bites) during a 22% institutional and 12% family-office redemption wave."
    overrides:
      participation_multiplier: 0.80
      redemption_multiplier: 1.10
      facility_capacity_multiplier: 0.25
      cohort_withdrawal_shocks:
        12:
          institutional: 0.22
        13:
          hnw: 0.12

  combined_adverse:
    scenario_id: "combined_adverse"
    name: "7. Combined crisis (rate cut, defaults, run, settlement freeze)"
    short_label: "Combined crisis"
    description: "A 150 bp rate cut, Month-12 write-downs on the lending funds, a 25% institutional and 10-15% family-office run over two months, longer settlement, higher forced-sale haircuts and a 50% facility cut."
    overrides:
      participation_multiplier: 0.35
      redemption_multiplier: 1.25
      yield_delta_annual: -0.015
      risk_free_delta_annual: -0.015
      capital_shock_schedule:
        12: -0.030
      settlement_lag_override: 3
      liquidation_haircut_bps_override: 110.0
      facility_capacity_multiplier: 0.50
      cohort_withdrawal_shocks:
        12:
          institutional: 0.25
          hnw: 0.10
        13:
          institutional: 0.10
          hnw: 0.15
          retail: 0.10
      design_overrides:
        buidl_treasury:
          capital_shock_schedule: {}
          settlement_lag_override: 0
          liquidation_haircut_bps_override: 10.0
        maple_syrup_usdc:
          capital_shock_schedule:
            12: -0.040
          settlement_lag_override: 3
          liquidation_haircut_bps_override: 110.0
        hamilton_lane_scope:
          capital_shock_schedule:
            12: -0.025
          settlement_lag_override: 4
          liquidation_haircut_bps_override: 150.0

  reverse_stress_test:
    scenario_id: "reverse_stress_test"
    name: "8. Severe institutional run (35% institutional + 20% family offices)"
    short_label: "Severe run"
    description: "A larger Month-12 run with slower settlement; the breaking-point search itself is reported separately in the reverse stress tests."
    overrides:
      participation_multiplier: 0.60
      redemption_multiplier: 1.15
      settlement_lag_override: 2
      liquidation_haircut_bps_override: 60.0
      cohort_withdrawal_shocks:
        12:
          institutional: 0.35
          hnw: 0.20
      design_overrides:
        buidl_treasury:
          settlement_lag_override: 0
          liquidation_haircut_bps_override: 5.0
        maple_syrup_usdc:
          settlement_lag_override: 2
          liquidation_haircut_bps_override: 65.0
        hamilton_lane_scope:
          settlement_lag_override: 3
          liquidation_haircut_bps_override: 110.0

monte_carlo:
  default_repetitions: 100
  random_seed: 20261026
  gross_yield_sd: 0.008
  stochastic_yield_volatility_annual: 0.010
  stochastic_capital_volatility_annual: 0.015
  stochastic_redemption_noise_std: 0.012
  design_overrides:
    buidl_treasury:
      # Stable $1.00 NAV money-market fund (Moody's Aaa-mf assessment, 2026-05-13): no mark-to-market noise
      gross_yield_sd: 0.003
      stochastic_yield_volatility_annual: 0.002
      stochastic_capital_volatility_annual: 0.0
    maple_syrup_usdc:
      gross_yield_sd: 0.010
    hamilton_lane_scope:
      gross_yield_sd: 0.008
