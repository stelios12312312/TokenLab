      redemption_fee_to_issuer_pct: {applicable: false, note: "no redemption fee"}
      platform_admin_fee_annual: {source: "Securitize S-1: BlackRock pays Securitize an upfront fee plus a share of average NAV (rate undisclosed); not a fund expense", url: "https://www.sec.gov/Archives/edgar/data/2094496/000162828026051182/secz-20260731.htm", as_of: "2026-07-31", confidence: "medium"}
