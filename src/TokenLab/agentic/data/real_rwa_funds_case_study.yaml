schema_version: "product_study.v1"
case_study_id: "real-rwa-funds-v1"
title: "Real-World RWA Fund Benchmark: BlackRock BUIDL vs. Maple SyrupUSDC vs. Hamilton Lane SCOPE"
subtitle: "Side-by-side institutional economic modelling, fee/break-even attribution, and liquidity stress-testing of three live on-chain RWA structures normalised to a $25M 36-month benchmark."
per_product_portfolio: true
evidence_status:
  classification: "empirical_term_sheet_benchmark_with_synthetic_stress_scenarios"
  statement: >
    Product fee schedules, asset-class yield benchmarks, redemption gates, settlement lags,
    and liquidity buffer structures are calibrated to publicly documented disclosures for
    BlackRock BUIDL (Securitize / Circle USDC Buffer), Maple Finance SyrupUSDC, and Hamilton
    Lane SCOPE (Securitize feeder). To enable an apples-to-apples institutional comparison,
    all three structures are evaluated on a normalised $25M initial AUM scale over 36 monthly
    periods across 8 synthetic behavioural and macro stress scenarios.

real_world_provenance:
  - design_id: "buidl_treasury"
    product_name: "BlackRock USD Institutional Digital Liquidity Fund (BUIDL)"
    ticker: "BUIDL"
    issuer: "BlackRock Financial Management"
    network_rail: "Securitize Markets • BNY Mellon • Circle USDC Buffer"
    issuer_and_infra: "BlackRock Financial Management • Securitize Markets (Transfer Agent) • BNY Mellon (Custodian) • Circle USDC Smart-Contract Buffer"
    asset_class: "Short-Term US Treasury Bills (<= 3M maturity), Overnight US Treasury Repo & Cash"
    gross_yield_benchmark: "4.85% p.a. (US T-Bills / SOFR)"
    published_fees: "35 bps p.a. blended mgmt (20–50 bps across chains) • 0% perf • 0 bps exit • 8 bps admin"
    reward_token_mechanics: "None"
    liquidity_buffer_and_facility: "15% cash/repo buffer + $5.0M Circle USDC instant facility (20% of $25M benchmark AUM)"
    redemption_gate: "Uncapped (24/7 USDC + T+0 primary)"
    settlement_lag: "T+0 (0-month lag)"
    stress_haircut: "3 bps bid-ask (8–10 bps in stress)"
    primary_source: "Securitize BUIDL Form D / Offering Memo & Circle USDC Liquidity Facility Docs; normalised to $25M AUM ($210k/yr fixed overhead)"
    documented_terms: "4.85% p.a. gross T-bill/SOFR yield benchmark; 20–50 bps p.a. management fee across chains (modelled at 35 bps blended); 0% performance fee; 0% exit fee; uncapped daily/instant redemptions backed by 15% liquid cash/repo buffer and Circle USDC instant redemption liquidity facility ($100M facility on ~$500M scale, modelled proportionally as $5.0M at $25M benchmark AUM); T+0/T+1 underlying T-bill settlement (0-month lag, 3 bps bid-ask haircut)."
    synthetic_assumptions: "Normalised to $25M starting AUM and $210k/yr fixed issuer/compliance overhead (+10 bps variable cost) to reveal the minimum AUM scale ($84.0M break-even) required for low-fee money-market wrappers to reach issuer profitability."
  - design_id: "maple_syrup_usdc"
    product_name: "Maple Finance Institutional Secured Lending (SyrupUSDC)"
    ticker: "SyrupUSDC"
    issuer: "Maple Finance & Pool Delegates"
    network_rail: "Syrup Smart-Contract Vaults (Ethereum / Solana / Base)"
    issuer_and_infra: "Maple Finance • Syrup Permissionless Smart-Contract Vaults (Ethereum / Solana / Base) • Maple Direct Pool Delegates"
    asset_class: "Overcollateralised Institutional Digital-Asset & Corporate Credit Loans (Fixed & Open-Term Repo/Margin Loans)"
    gross_yield_benchmark: "9.60% p.a. (Institutional Secured Loans)"
    published_fees: "50 bps p.a. platform + 10% delegate perf (>4.50% hurdle) • 15 bps pool-retained exit spread"
    reward_token_mechanics: "+50 bps p.a. ($125k/yr) SYRUP drip"
    liquidity_buffer_and_facility: "6% liquid USDC vault buffer + $0.5M protocol liquidity reserve"
    redemption_gate: "25.0% NAV / monthly cycle cap"
    settlement_lag: "T+1 month loan maturity cycle"
    stress_haircut: "45 bps unwind (95–110 bps in freeze)"
    primary_source: "Maple Finance SyrupUSDC Pool Docs & On-Chain Vault Parameters; normalised to $25M AUM (-3.5% to -4.0% stress credit write-downs)"
    documented_terms: "9.60% p.a. gross institutional loan yield; 50 bps p.a. platform fee + 10% pool delegate/performance fee above 4.50% hurdle; 15 bps early withdrawal/unwind spread retained by lending pool; ~6% liquid USDC vault buffer; ~30-day (1-month) loan maturity cycle for redemptions exceeding liquid cash; 25% monthly cycle throughput cap; SYRUP token drip reward overlay (~50 bps p.a. equivalent)."
    synthetic_assumptions: "Normalised to $25M starting AUM with $0.5M internal protocol liquidity reserve (no external bank credit line), 45 bps forced early loan-assignment haircut under stress, and heightened credit default sensitivity in adverse credit scenarios."
  - design_id: "hamilton_lane_scope"
    product_name: "Hamilton Lane Senior Credit Opportunities Fund (SCOPE)"
    ticker: "SCOPE"
    issuer: "Hamilton Lane Advisors"
    network_rail: "Securitize On-Chain Feeder (Polygon / Ethereum / Optimism / Solana)"
    issuer_and_infra: "Hamilton Lane Advisors • On-Chain Feeder via Securitize (Polygon / Ethereum / Optimism / Solana)"
    asset_class: "Senior Secured First-Lien Floating-Rate Middle-Market Corporate Private Credit Loans (SOFR + 500–600 bps)"
    gross_yield_benchmark: "10.40% p.a. (SOFR + 550 bps Senior Credit)"
    published_fees: "140 bps p.a. mgmt (125–150 bps range) + 12.5% incentive (>6.00% hurdle) • 50 bps anti-dilution levy"
    reward_token_mechanics: "None"
    liquidity_buffer_and_facility: "8% cash buffer + $3.0M committed NAV credit line (12% of $25M benchmark AUM)"
    redemption_gate: "Strict 5.0% NAV / month gate"
    settlement_lag: "T+2 month secondary loan sale lag"
    stress_haircut: "85 bps loan sale (140–150 bps in freeze)"
    primary_source: "Hamilton Lane SCOPE / Securitize Feeder Term Sheet; normalised to $25M AUM (-2.0% to -2.5% stress credit write-downs)"
    documented_terms: "10.40% p.a. gross senior corporate credit yield; 140 bps p.a. management fee (125–150 bps documented feeder range) + 12.5% incentive fee above 6.00% hurdle; 50 bps anti-dilution / early exit protection (60% retained by portfolio, 40% to manager); documented 5.0% monthly NAV redemption gate; T+2 month underlying secondary private-credit loan liquidation lag; $3.0M committed NAV credit facility (12% of $25M benchmark AUM)."
    synthetic_assumptions: "Normalised to $25M feeder AUM with 85 bps forced-sale secondary loan haircut when redemptions exhaust cash and credit line capacity."

time_convention:
  unit: "month"
  periods_per_year: 12
  horizon_periods: 36
  annualisation_convention: "compound_geometric_for_returns_linear_for_fee_rates"

objectives_tested:
  payment_sla_max_months: 3.0
  min_liquidity_buffer_pct_nav: 0.03
  issuer_operating_profit_floor_fiat: 0.0

