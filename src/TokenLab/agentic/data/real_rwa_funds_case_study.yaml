      hurdle_rate_annual: 0.0
      redemption_fee_rate: 0.0
      redemption_fee_to_issuer_pct: 0.0
      platform_admin_fee_annual: 0.0
      platform_admin_cost_bearer: "portfolio"
      fixed_operating_cost_annual: 210000.0
      variable_operating_cost_bps: 10.0
    redemption_rules:
      gate_max_pct_nav_per_period: null
      payment_sla_periods: 3
      queue_pricing: "payment_date_nav"
    liquidity_facility:
      max_capacity: 0.0
      interest_rate_annual: 0.0
      commitment_fee_annual: 0.0
      cost_bearer: "portfolio"
    secondary_market:
      required_return_annual: 0.10
      illiquidity_premium: 0.0
      max_discount: 0.35
    provenance:
      gross_yield_annual: {source: "rwa.xyz BUIDL: 30-day yield 3.70% plus 0.26% blended fee", url: "https://app.rwa.xyz/assets/BUIDL", as_of: "2026-10-27", confidence: "medium", note: "reported yield is distribution-based, so treated as net of fees"}
      capital_appreciation_annual: {source: "Securitize launch release: seeks a stable $1.00 NAV", url: "https://investors.securitize.io/news/news-details/2024/BlackRock-Launches-Its-First-Tokenized-Fund-BUIDL-on-the-Ethereum-Network-03-20-2024/default.aspx", as_of: "2024-03-20", confidence: "high"}
      portfolio_expense_annual: {assumption: true, note: "no fund expenses beyond the management fee are disclosed", sweep: [0.0, 0.0005, 0.0010]}
      settlement_lag_periods: {source: "Ondo: BUIDL redemptions settle within about one business day", url: "https://ondo.finance/blog/building-on-buidl-how-ondo-leverages-blackrocks-tokenized-treasuries", as_of: "2024-08-28", confidence: "high"}
      liquidation_haircut_bps: {assumption: true, note: "T-bill bid/ask cost", sweep: [1.0, 3.0, 10.0]}
      reward_token_annual_budget_fiat: {source: "Securitize launch release: no token incentive programme", url: "https://investors.securitize.io/news/news-details/2024/BlackRock-Launches-Its-First-Tokenized-Fund-BUIDL-on-the-Ethereum-Network-03-20-2024/default.aspx", as_of: "2024-03-20", confidence: "medium"}
      target_cash_buffer_pct: {source: "Holdings are 100% cash, T-bills and repo, all income-earning; no idle buffer modelled", url: "https://investors.securitize.io/news/news-details/2024/BlackRock-Launches-Its-First-Tokenized-Fund-BUIDL-on-the-Ethereum-Network-03-20-2024/default.aspx", as_of: "2024-03-20", confidence: "high"}
      distribution_policy: {source: "Markets Media: distributions paid daily since January 2025", url: "https://www.marketsmedia.com/securitize-adds-features-for-blackrock-tokenized-treasury-fund/", as_of: "2025-01-23", confidence: "high"}
      distribution_reinvestment_rate: {assumption: true, note: "paid as new tokens at launch (2024); the form of daily payouts since 2025 is not restated", sweep: [0.0, 0.5, 1.0]}
      management_fee_annual: {source: "Securitize BUIDL share classes: 50 bps on Ethereum, Arbitrum, Optimism; 20 bps on Aptos, Avalanche, Polygon, Solana; 18 bps on BNB Smart Chain; blended by current supply per chain (rwa.xyz)", url: "https://securitize.io/blackrock/buidl", as_of: "2026-07-14", confidence: "high", note: "Tempo fee not published; a second table on the same page lists BNB Chain at 20 bps; on the 20 bp classes chain foundations pay BlackRock a quarterly fee"}
      income_share_fee_rate: {source: "Fee is a percentage of NAV, not of income", url: "https://securitize.io/blackrock/buidl", as_of: "2026-07-14", confidence: "high"}
