# Canonical public demand-history demo (schema v2).
#
# Historical-demand archetype: an exogenous fiat transaction-volume series is
# replayed through TransactionManagement_FromData, price comes from
# PriceFunction_LinearRegression, and holding time is stochastic. The volume
# series is generated by TokenLab.agentic.data.synthetic_demand from a
# documented logistic formula with recorded seed 20260817 (20 periods, units
# "illustrative $ per step"); it is synthetic, uncalibrated, and carries no
# client or market data lineage. The three priors are illustrative,
# uncalibrated, explicitly independent, per-path parameter draws bracketing
# the library defaults. They are not fitted to data and are not a forecast.
schema_version: 2
scenario_id: public-demand-history-v2
economy:
  type: TokenEconomy_Basic
  parameters:
    initial_price: 0.01
    fiat: "$"
    token: DTLB
  holding_time:
    type: HoldingTime_Stochastic
    parameters:
      holding_time_params: {loc: 0, s: 1}
      minimum: 0.1
  supply:
    type: SupplyController_Constant
    parameters:
      supply: 1000000000
  price:
    type: PriceFunction_LinearRegression
    parameters:
      std_prior: 0.1
      anchoring: 0.3
  supply_pools: []
  agent_pools:
    - id: demand-replay
      type: AgentPool_Basic
      parameters:
        currency: "$"
        name: demand-replay
      users:
        # Placeholder cohort: TransactionManagement_FromData replays the
        # exogenous volume series and ignores the user count; the constant
        # pool documents this rather than implying user-driven demand.
        type: UserGrowth_Constant
        parameters:
          constant: 1
      transactions:
        type: TransactionManagement_FromData
        parameters:
          # Inline copy of synthetic_demand.synthetic_demand_series()
          # (logistic rise + jitter + terminal dip, seed 20260817); the
          # parity test re-derives it from the documented formula.
          data: [17757, 39240, 74615, 143189, 278152, 468214, 654994, 937245, 1205317, 1268660, 1427137, 1241202, 1408772, 1341812, 1362745, 1420793, 1409717, 1356690, 1460786, 786108]
monte_carlo:
  simulator: TokenMetaSimulator
  iterations: 20
  repetitions: 1
  seed: 20260817
artifacts:
  format: csv
uncertainty:
  parameters:
    - id: price_std_prior
      path: economy.price.parameters.std_prior
      value_type: number
      unit: price-noise scale as a fraction of the previous price
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 0.05
        mode: 0.1
        maximum: 0.2
      bounds: {minimum: 0.05, maximum: 0.2}
      provenance: "Library default bracket for PriceFunction_LinearRegression, uncalibrated; sanitized illustrative demo assumption."
      rationale: "Brackets the price-noise scale around the library default 0.1, from half to double the default."
      calibration: illustrative
      approval: approved
      dependence: independent
    - id: price_anchoring
      path: economy.price.parameters.anchoring
      value_type: number
      unit: fraction of the previous price retained per step
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 0.1
        mode: 0.3
        maximum: 0.5
      bounds: {minimum: 0.1, maximum: 0.5}
      provenance: "Library default bracket for PriceFunction_LinearRegression, uncalibrated; sanitized illustrative demo assumption."
      rationale: "Brackets the price-anchoring weight around the library default 0.3 within the documented [0.1, 0.5] bracket."
      calibration: illustrative
      approval: approved
      dependence: independent
    - id: holding_time_dispersion
      path: economy.holding_time.parameters.holding_time_params.s
      value_type: number
      unit: lognorm shape parameter
      layer: parameter
      cadence: per_path
      distribution:
        family: triangular
        minimum: 0.5
        mode: 1.0
        maximum: 1.5
      bounds: {minimum: 0.5, maximum: 1.5}
      provenance: "Library default bracket for HoldingTime_Stochastic (lognorm), uncalibrated; sanitized illustrative demo assumption."
      rationale: "Brackets the holding-time lognorm shape around the library default 1.0, from half to 1.5x the default."
      calibration: illustrative
      approval: approved
      dependence: independent
  dependence_groups: []
