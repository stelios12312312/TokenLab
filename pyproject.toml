[build-system]
requires = [
  "packaging>=24.2",
  "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "TokenLab"
version = "0.2.0"
description = "TokenLab is the ultimate tokenomics simulator."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Stylianos Kampakis", email = "stylianos.kampakis@gmail.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]
dependencies = [
  "matplotlib==3.5.2",
  "numpy==1.22.4",
  "pandas==1.5.2",
  "scipy==1.9.3",
  "statsmodels==0.13.2",
  "tqdm==4.64.0",
  "PyYAML>=6.0.0",
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
notebook = [
  "nbconvert>=7.16,<8.0",
]
reporting = [
  "openpyxl>=3.1.0",
  "pyarrow>=16.0.0",
  "PyMuPDF>=1.24.0",
  "pypdf>=6.5.0,<7.0",
  "python-pptx>=1.0.2,<2.0",
  "tabulate>=0.9.0,<1.0",
]
test = [
  "pytest>=8.0,<9.0",
]
z1 = [
  "SALib>=1.4.7,<1.5.0",
  "seaborn>=0.11.2",
]

[project.urls]
Homepage = "https://github.com/stelios12312312/TokenLab"
Repository = "https://github.com/stelios12312312/TokenLab"

[project.scripts]
tokenlab = "TokenLab.cli:main"
tokenlab-verify = "TokenLab.utils.verifier:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["TokenLab*"]
